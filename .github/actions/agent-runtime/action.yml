name: Agent runtime
description: >-
  Bootstraps a coding-agent run under the preserf GitHub-App identity: mints a
  short-lived installation token, resolves the bot's git identity, checks out
  the repo as the bot, configures git, and runs the opencode engine with the
  supplied prompt. Everything the agent commits, pushes, or opens is attributed
  to the App's bot user.

inputs:
  prompt:
    description: Full prompt handed to the agent (persona + request, already composed).
    required: true
  app-id:
    description: GitHub App ID (from a repo/org variable).
    required: true
  private-key:
    description: GitHub App private key (from a secret).
    required: true
  opencode-api-key:
    description: opencode engine API key (from a secret).
    required: true
  model:
    description: opencode model id.
    required: false
    default: opencode-go/glm-5.2
  swissai-api-key:
    description: Optional Swiss AI key, for swiss-ai/* models.
    required: false
    default: ""
  cscs-inference-api-key:
    description: Optional CSCS Inference key, for cscs-inference/* models.
    required: false
    default: ""
  checkout-ref:
    description: >-
      Ref or SHA to check out. Leave empty to use the default-branch checkout
      (issue/comment events run on the default branch); set to the PR head SHA
      for PR-context runs so the agent acts on the PR's code.
    required: false
    default: ""
  drop-project-context:
    description: >-
      When "true", replace the checked-out ref's opencode project config
      (.opencode/ and root opencode.json) with the trusted default-branch
      version before running opencode. Set this for agents that check out an
      arbitrary/untrusted ref (e.g. a PR under review): it neutralises any
      hostile plugin/tool/mcp/formatter the reviewed ref might carry AND keeps a
      valid providers config so the run still works. Default "false" keeps the
      checked-out ref's project context.
    required: false
    default: "false"
  permission-contents:
    description: >-
      Optional least-privilege scope ("read"/"write") for the minted App token's
      Contents permission. Empty (the default) inherits the installation's full
      grant, preserving prior behaviour. Set "read" on agents that never push.
    required: false
    default: ""
  permission-issues:
    description: Optional scope for the token's Issues permission (see permission-contents).
    required: false
    default: ""
  permission-pull-requests:
    description: Optional scope for the token's Pull requests permission (see permission-contents).
    required: false
    default: ""

outputs:
  token:
    description: The minted installation token (so callers can post as the bot).
    value: ${{ steps.app.outputs.token }}
  bot-name:
    description: Resolved bot git identity, e.g. repo-agent[bot].
    value: ${{ steps.bot.outputs.name }}

runs:
  using: composite
  steps:
    - name: Mint App installation token
      id: app
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        # Empty permission-* inputs are ignored by the action, so the token
        # inherits the installation's full grant (prior behaviour). A caller
        # (e.g. the automatic triager, which runs untrusted issue text) sets
        # these to least-privilege to cap the blast radius of a prompt injection.
        permission-contents: ${{ inputs.permission-contents }}
        permission-issues: ${{ inputs.permission-issues }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}

    # create-github-app-token already registers the token as a secret, but mask
    # it explicitly too: it is a runtime-minted credential, so a stray `set -x`
    # in any downstream step must not surface it in logs.
    - name: Mask installation token
      shell: bash
      env:
        TOKEN: ${{ steps.app.outputs.token }}
      run: echo "::add-mask::$TOKEN"

    # The committer email must be the bot's <user-id>+<slug>[bot] noreply form
    # for commits to show the bot's avatar; the numeric id is not handed to us,
    # so fetch it once from the users API.
    - name: Resolve bot git identity
      id: bot
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        SLUG: ${{ steps.app.outputs.app-slug }}
      run: |
        set -euo pipefail
        uid=$(gh api "/users/${SLUG}[bot]" --jq .id)
        # A failed/empty API response must not silently configure a bad
        # committer email; the id is always a positive integer.
        if [[ ! "$uid" =~ ^[0-9]+$ ]]; then
          echo "::error::could not resolve numeric user id for ${SLUG}[bot] (got '${uid}')" >&2
          exit 1
        fi
        echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
        echo "email=${uid}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

    - name: Checkout as the bot
      uses: actions/checkout@v6.0.3
      with:
        ref: ${{ inputs.checkout-ref }}
        token: ${{ steps.app.outputs.token }}
        # Keep the bot token in the local git config so the agent can push.
        persist-credentials: true

    - name: Configure git identity
      shell: bash
      env:
        BOT_NAME: ${{ steps.bot.outputs.name }}
        BOT_EMAIL: ${{ steps.bot.outputs.email }}
      run: |
        git config user.name  "$BOT_NAME"
        git config user.email "$BOT_EMAIL"

    # opencode discovers project config under .opencode/ and at the repo root
    # (opencode.json), and it *executes* content from there at startup —
    # formatter commands, local mcp-server commands, and any .opencode/plugin|tool
    # code — before the agent does anything. On a reviewed ref (e.g. a fork PR
    # under review) all of that is attacker-controlled, so a hostile head could
    # run code under the App token via a planted plugin/mcp/formatter, or ship a
    # config opencode rejects and aborts on. Rather than delete piecemeal (which
    # would also drop the providers config the run needs), swap the whole set for
    # the trusted default-branch version: it neutralises tampering and keeps a
    # valid providers config so the run still works. `git update-index
    # --skip-worktree` + `git reset` around the swap keep a write-agent's later
    # `git add -A` / commit from recording it (the .opencode symlinks point at
    # .agents/*, whose targets are left intact for other tools).
    - name: Restore trusted opencode config for the reviewed ref
      if: ${{ inputs.drop-project-context == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
      run: |
        set -euo pipefail
        default_branch=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
        # Fail (rather than run on untrusted config) if the trusted ref can't be
        # fetched; the checkout above brought only the reviewed ref into scope.
        git fetch --depth=1 origin "$default_branch"
        # opencode reads config from both the .opencode/ dir and root opencode.json;
        # opencode.jsonc is listed too in case a ref uses that spelling at the root.
        paths=(.opencode opencode.json opencode.jsonc)
        for p in "${paths[@]}"; do
          git ls-files -z -- "$p" | xargs -0 -r git update-index --skip-worktree || true
          rm -rf "$p"
        done
        for p in "${paths[@]}"; do
          # Skip any path absent on the trusted ref; restore the rest verbatim.
          git checkout "origin/$default_branch" -- "$p" 2>/dev/null || true
        done
        # Re-mark the restored entries skip-worktree, then reset the index back
        # to the reviewed ref so the swap is invisible to a later `git add -A`.
        git ls-files -z -- "${paths[@]}" | xargs -0 -r git update-index --skip-worktree || true
        git reset -q -- "${paths[@]}" 2>/dev/null || true

    - name: Run opencode
      uses: anomalyco/opencode/github@latest
      env:
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key }}
        # Custom providers in opencode.json read their own key from the
        # environment (swiss-ai -> SWISSAI_API_KEY, cscs-inference -> CSCS_INFERENCE_API_KEY).
        SWISSAI_API_KEY: ${{ inputs.swissai-api-key }}
        CSCS_INFERENCE_API_KEY: ${{ inputs.cscs-inference-api-key }}
        # The agent's git/gh tools act as the bot via this token.
        GH_TOKEN: ${{ steps.app.outputs.token }}
        GITHUB_TOKEN: ${{ steps.app.outputs.token }}
      with:
        model: ${{ inputs.model }}
        prompt: ${{ inputs.prompt }}
