name: Agent runtime
description: >-
  Bootstraps a coding-agent run under the preserf GitHub-App identity: mints a
  short-lived installation token, resolves the bot's git identity, checks out
  the repo as the bot, configures git, and runs the opencode engine with the
  supplied prompt. Everything the agent commits, pushes, or opens is attributed
  to the App's bot user.

inputs:
  prompt:
    description: Full prompt handed to the agent (persona + request, already composed).
    required: true
  app-id:
    description: GitHub App ID (from a repo/org variable).
    required: true
  private-key:
    description: GitHub App private key (from a secret).
    required: true
  opencode-api-key:
    description: opencode engine API key (from a secret).
    required: true
  model:
    description: opencode model id.
    required: false
    default: opencode-go/glm-5.2
  swissai-api-key:
    description: Optional Swiss AI key, for swiss-ai/* models.
    required: false
    default: ""
  cscs-inference-api-key:
    description: Optional CSCS Inference key, for cscs-inference/* models.
    required: false
    default: ""
  checkout-ref:
    description: >-
      Ref or SHA to check out. Leave empty to use the default-branch checkout
      (issue/comment events run on the default branch); set to the PR head SHA
      for PR-context runs so the agent acts on the PR's code.
    required: false
    default: ""
  drop-project-context:
    description: >-
      When "true", remove the project's .opencode/agents|commands|skills before
      running opencode. Set this for agents that check out an arbitrary/untrusted
      ref (e.g. a PR under review) whose project config might be invalid for
      opencode and abort the run. Default "false" keeps the project context.
    required: false
    default: "false"

outputs:
  token:
    description: The minted installation token (so callers can post as the bot).
    value: ${{ steps.app.outputs.token }}
  bot-name:
    description: Resolved bot git identity, e.g. repo-agent[bot].
    value: ${{ steps.bot.outputs.name }}

runs:
  using: composite
  steps:
    - name: Mint App installation token
      id: app
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}

    # create-github-app-token already registers the token as a secret, but mask
    # it explicitly too: it is a runtime-minted credential, so a stray `set -x`
    # in any downstream step must not surface it in logs.
    - name: Mask installation token
      shell: bash
      env:
        TOKEN: ${{ steps.app.outputs.token }}
      run: echo "::add-mask::$TOKEN"

    # The committer email must be the bot's <user-id>+<slug>[bot] noreply form
    # for commits to show the bot's avatar; the numeric id is not handed to us,
    # so fetch it once from the users API.
    - name: Resolve bot git identity
      id: bot
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        SLUG: ${{ steps.app.outputs.app-slug }}
      run: |
        set -euo pipefail
        uid=$(gh api "/users/${SLUG}[bot]" --jq .id)
        # A failed/empty API response must not silently configure a bad
        # committer email; the id is always a positive integer.
        if [[ ! "$uid" =~ ^[0-9]+$ ]]; then
          echo "::error::could not resolve numeric user id for ${SLUG}[bot] (got '${uid}')" >&2
          exit 1
        fi
        echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
        echo "email=${uid}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

    - name: Checkout as the bot
      uses: actions/checkout@v6.0.3
      with:
        ref: ${{ inputs.checkout-ref }}
        token: ${{ steps.app.outputs.token }}
        # Keep the bot token in the local git config so the agent can push.
        persist-credentials: true

    - name: Configure git identity
      shell: bash
      env:
        BOT_NAME: ${{ steps.bot.outputs.name }}
        BOT_EMAIL: ${{ steps.bot.outputs.email }}
      run: |
        git config user.name  "$BOT_NAME"
        git config user.email "$BOT_EMAIL"

    # opencode validates the project agents/commands/skills it discovers under
    # .opencode/ at startup and aborts the whole run if one is invalid — and the
    # checked-out ref (e.g. a PR under review) may carry definitions in a format
    # opencode rejects (an older `tools:` string, `model: inherit`, ...). Our
    # runs drive opencode's built-in primary agent with an explicit prompt and
    # never use these project extras, so drop them before running (the root
    # .opencode/opencode.jsonc — providers, permission, formatter — is kept).
    # `git update-index --skip-worktree` first, so a write-agent's `git add -A` /
    # commit cannot record the removal; these are symlinks to .agents/*, whose
    # targets are left intact for other tools.
    - name: Drop project agents/commands/skills for the opencode run
      if: ${{ inputs.drop-project-context == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        for p in .opencode/agents .opencode/agent .opencode/commands .opencode/command .opencode/skills .opencode/skill; do
          [ -e "$p" ] || [ -L "$p" ] || continue
          # Mark every tracked entry under $p skip-worktree before removing it,
          # so a write-agent's later `git add -A` can't stage the removal. Uses
          # `git ls-files` so this holds whether $p is a symlink, a file, or a
          # real tracked directory (an arbitrary reviewed ref may ship any).
          git ls-files -z -- "$p" | xargs -0 -r git update-index --skip-worktree || true
          rm -rf "$p"
        done

    - name: Run opencode
      uses: anomalyco/opencode/github@latest
      env:
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key }}
        # Custom providers in opencode.json read their own key from the
        # environment (swiss-ai -> SWISSAI_API_KEY, cscs-inference -> CSCS_INFERENCE_API_KEY).
        SWISSAI_API_KEY: ${{ inputs.swissai-api-key }}
        CSCS_INFERENCE_API_KEY: ${{ inputs.cscs-inference-api-key }}
        # The agent's git/gh tools act as the bot via this token.
        GH_TOKEN: ${{ steps.app.outputs.token }}
        GITHUB_TOKEN: ${{ steps.app.outputs.token }}
      with:
        model: ${{ inputs.model }}
        prompt: ${{ inputs.prompt }}
