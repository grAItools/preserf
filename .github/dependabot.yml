updates:
- cooldown:
    default-days: 7
  directory: /
  groups:
    dependencies:
      patterns:
      - "*"
  ignore:
  - dependency-name: "github/gh-aw-actions" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  package-ecosystem: github-actions
  schedule:
    interval: monthly
- cooldown:
    default-days: 7
  # The `/` github-actions entry only scans .github/workflows/; the composite
  # action's own action pins (checkout, create-github-app-token, opencode) live
  # here and need their own directory entry to be updated.
  directory: /.github/actions/agent-runtime
  groups:
    dependencies:
      patterns:
      - "*"
  package-ecosystem: github-actions
  schedule:
    interval: monthly
- cooldown:
    default-days: 7
  directory: /.devcontainer
  groups:
    dependencies:
      patterns:
      - "*"
  package-ecosystem: docker
  schedule:
    interval: monthly
version: 2
