name: repo-agent

# Reusable workflow: wraps the @mention plumbing (loop guard, mention parse,
# auth gate, model selection) around the agent-runtime composite action.
# Callers supply only an `on:` trigger and a `base-prompt`; everything else,
# including the ^model selection table, is shared infrastructure defined here
# once — callers never replicate it.
#
# A reusable workflow cannot declare the caller's `on:` triggers, so each
# caller owns its own trigger block and calls this with `uses:`.

on:
  workflow_call:
    inputs:
      base-prompt:
        description: The agent's persona / standing instructions.
        required: true
        type: string
      trigger-phrase:
        description: Mention handle that fires the agent.
        required: false
        type: string
        default: "@repo-agent"
      models:
        description: >-
          YAML table of selectable models. Each entry: `name` (the ^token a
          user types, e.g. ^glm), `model` (opencode id), and optional
          `default: true`. A mention with one or more ^<name> tokens runs those
          models (one parallel run each); a mention with no token runs the
          default(s). Defined once here — callers only override to change the
          menu. The table should always mark at least one `default: true`.
        required: false
        type: string
        default: |
          - name: default
            model: ${{ vars.REPO_AGENT_MODEL_DEFAULT }}
            default: true
          - name: small
            model: ${{ vars.REPO_AGENT_MODEL_SMALL }}
          - name: large
            model: ${{ vars.REPO_AGENT_MODEL_LARGE }}
          - name: cscs:glm
            model: cscs-inference/zai-org/GLM-5.2
          - name: cscs:kimi
            model: cscs-inference/moonshotai/Kimi-K2.7-Code
          - name: sai:glm4
            model: swiss-ai/zai-org/GLM-4.7-Flash
      runs-on:
        description: Runner label for the agent job.
        required: false
        type: string
        default: ubuntu-latest
      allowed-associations:
        description: >-
          Comma-separated author_association values permitted to invoke the
          agent. Gate runs before any PR-head checkout. Ignored when
          require-mention is false.
        required: false
        type: string
        default: "OWNER,MEMBER,COLLABORATOR"
      require-mention:
        description: >-
          When true (default) the agent runs only if the trigger-phrase is
          mentioned, and the command is the text after it, gated by
          author_association. When false the agent runs automatically on every
          non-bot triggering event with an empty command (base-prompt only) and
          no author gate — for unattended automations like issue triage that key
          off the event itself, not a mention.
        required: false
        type: boolean
        default: true
    secrets:
      OPENCODE_API_KEY:
        required: true
      REPO_AGENT_APP_KEY:
        required: true
      SWISSAI_API_KEY:
        required: false
      CSCS_INFERENCE_API_KEY:
        required: false

concurrency:
  # Serialize the SAME agent on one issue/PR (across any number of comments),
  # while letting DIFFERENT agents on the same issue/PR run in parallel — the
  # key is (agent identity, issue/PR number). cancel-in-progress stays off so an
  # in-flight commit/push is queued behind, not killed mid-run. By default
  # (queue: single) GitHub keeps at most ONE pending run per group, so a burst of
  # same-agent retriggers collapses to (running + newest pending) rather than
  # queueing every one — see the Concurrency section in docs/agent-workflows.md.
  group: agent-${{ inputs.trigger-phrase }}-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  select:
    # Coarse pre-filter + loop guard: skip the agent's own comments. In mention
    # mode, only spin a runner when the trigger phrase appears in the payload; in
    # automatic mode (require-mention == false) run on every non-bot event.
    if: >-
      github.event.sender.type != 'Bot' &&
      ( inputs.require-mention == false
        || contains(github.event.comment.body || '', inputs.trigger-phrase)
        || contains(github.event.review.body || '', inputs.trigger-phrase)
        || contains(github.event.issue.body || '', inputs.trigger-phrase) )
    runs-on: ubuntu-latest
    outputs:
      mentioned: ${{ steps.ctx.outputs.mentioned }}
      matrix: ${{ steps.pick.outputs.matrix }}
      prompt: ${{ steps.pick.outputs.prompt }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Parse mention
        id: ctx
        uses: actions/github-script@v7
        env:
          PHRASE: ${{ inputs.trigger-phrase }}
          REQUIRE_MENTION: ${{ inputs.require-mention }}
        with:
          script: |
            // Automatic mode: the event itself is the trigger, so there is no
            // mention to parse and no per-invocation command (base-prompt only).
            if (process.env.REQUIRE_MENTION !== 'true') {
              core.setOutput('mentioned', 'true');
              core.setOutput('command', '');
              return;
            }
            const body =
              context.payload.comment?.body ??
              context.payload.review?.body ??
              context.payload.issue?.body ?? '';
            // Word-boundary match so "@repo-agent-staging" does not trigger.
            const phrase = process.env.PHRASE.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            // Detect and extract with the SAME anchored match: the mention must
            // start the line or follow whitespace, and must not be followed by a
            // word char or hyphen (so "@repo-agent-staging" does not fire). The
            // command is everything after that first valid mention, so an earlier
            // "foo@repo-agent" substring can't hijack the request text.
            const m = body.match(new RegExp(`(?:^|\\s)${phrase}(?![\\w-])`));
            const mentioned = !!m;
            const command = mentioned ? body.slice(m.index + m[0].length).trim() : '';
            core.setOutput('mentioned', String(mentioned));
            core.setOutput('command', command);

      - name: Authorize caller
        # Automatic mode keys off the trusted event (issue/PR opened), not a
        # mentioning user, so there is no author_association gate.
        if: steps.ctx.outputs.mentioned == 'true' && inputs.require-mention
        uses: actions/github-script@v7
        env:
          ALLOWED: ${{ inputs.allowed-associations }}
        with:
          script: |
            const assoc =
              context.payload.comment?.author_association ??
              context.payload.review?.author_association ??
              context.payload.issue?.author_association;
            const allowed = process.env.ALLOWED.split(',').map(s => s.trim());
            if (!allowed.includes(assoc))
              core.setFailed(`Not authorized: author_association=${assoc}`);

      - name: Select models and compose prompt
        id: pick
        if: steps.ctx.outputs.mentioned == 'true'
        env:
          MODELS: ${{ inputs.models }}
          BASE: ${{ inputs.base-prompt }}
          COMMAND: ${{ steps.ctx.outputs.command }}
        shell: bash
        run: |
          set -euo pipefail
          models_json=$(printf '%s' "$MODELS" | yq -o=json -I=0)

          # Parse ^<name> selection tokens and strip them from the command using
          # CONSTANT regexes only — model names are compared by exact string
          # equality, never interpolated into a pattern, so a name containing a
          # regex metacharacter can't break matching or stripping. A selection
          # token is a start- or whitespace-led "^" followed by a run of
          # non-whitespace that exactly equals a table name; a no-token mention
          # falls back to the table default(s). gsub only rewrites the tokens, so
          # the rest of the request text (including newlines) is preserved.
          result=$(jq -cn --argjson m "$models_json" --arg cmd "$COMMAND" '
            ($m | map(.name)) as $names
            | ( [ $cmd | scan("(?:^|\\s)\\^(\\S+)") | .[0] | select(. as $n | $names | index($n)) ] | unique ) as $picked
            | ( if ($picked | length) > 0
                then [ $m[] | select(.name as $n | $picked | index($n)) ]
                else [ $m[] | select(.default == true) ] end ) as $selected
            | {
                matrix: { include: ($selected | map({name, model})) },
                cleaned: ( $cmd
                           | gsub("(?<lead>(?:^|\\s))\\^(?<name>\\S+)";
                               if (.name as $n | $names | index($n)) then "" else "\(.lead)^\(.name)" end)
                           | sub("^\\s+"; "") | sub("\\s+$"; "") )
              }')

          matrix=$(jq -c '.matrix' <<<"$result")

          # A caller can override `models` with a table that has no default; a
          # tokenless mention then selects nothing. Fail loudly rather than
          # dispatch an empty/invalid matrix.
          if [ "$(jq -r '.include | length' <<<"$matrix")" -eq 0 ]; then
            echo "::error::no models selected: the ^token(s) matched no table entry and the models table has no 'default: true'." >&2
            exit 1
          fi

          # An entry can carry an empty model id if its backing repo variable
          # (e.g. REPO_AGENT_MODEL_DEFAULT) is unset — catch it here rather than
          # dispatch opencode with an empty model.
          empty=$(jq -r '.include[] | select((.model // "") == "") | .name' <<<"$matrix")
          if [ -n "$empty" ]; then
            echo "::error::model id is empty for: ${empty//$'\n'/, } — set the backing REPO_AGENT_MODEL_* repository variable(s)." >&2
            exit 1
          fi

          cleaned=$(jq -r '.cleaned' <<<"$result")

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # Random per-run heredoc delimiter: the request text is untrusted user
          # input, so a fixed marker could be spoofed to break out of GITHUB_OUTPUT.
          delim="AGENT_PROMPT_EOF_${RANDOM}${RANDOM}${RANDOM}"
          {
            echo "prompt<<${delim}"
            if [ -n "$cleaned" ]; then
              # User text after the mention becomes the request under a heading.
              printf '%s\n\n## Request\n\n%s\n' "$BASE" "$cleaned"
            else
              # Mention-only trigger (no extra prompt): hand opencode just the
              # base prompt, with no empty "## Request" section.
              printf '%s\n' "$BASE"
            fi
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve PR head ref
        id: ref
        if: steps.ctx.outputs.mentioned == 'true'
        uses: actions/github-script@v7
        with:
          # issue_comment payloads omit the PR head SHA, so fetch it; non-PR
          # events fall through to an empty ref (default-branch checkout).
          script: |
            const num = context.payload.issue?.number ?? context.payload.pull_request?.number;
            const isPr = !!(context.payload.issue?.pull_request || context.payload.pull_request);
            if (!isPr || !num) { core.setOutput('sha', ''); return; }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: num,
            });
            core.setOutput('sha', pr.head.sha);

  agent:
    needs: select
    if: needs.select.outputs.mentioned == 'true'
    runs-on: ${{ inputs.runs-on }}
    name: agent (${{ matrix.name }})
    environment: opencode
    permissions:
      # opencode's OIDC needs id-token; contents lets the runner fetch the
      # agent-runtime composite action from this repo. All repo/issue/PR writes
      # ride the App token from agent-runtime, and the PR head is resolved in the
      # `select` job, so issues/pull-requests are not needed. A reusable job may
      # not request more than the caller grants (a hard error, not a silent cap).
      id-token: write
      contents: read
    strategy:
      # One ^model must not cancel the others; each reports independently.
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      # Reference the composite action by full repo path @ref, NOT a local `./`
      # path: a reusable workflow resolves a local action before any checkout
      # populates the workspace, so `./` fails with "Can't find action.yml …".
      # GitHub fetches it from the repo instead; agent-runtime then checks out
      # the target ref as the bot.
      - name: Run agent
        uses: grAItools/preserf/.github/actions/agent-runtime@main
        with:
          prompt: ${{ needs.select.outputs.prompt }}
          model: ${{ matrix.model }}
          app-id: ${{ vars.REPO_AGENT_APP_ID }}
          private-key: ${{ secrets.REPO_AGENT_APP_KEY }}
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
          swissai-api-key: ${{ secrets.SWISSAI_API_KEY }}
          cscs-inference-api-key: ${{ secrets.CSCS_INFERENCE_API_KEY }}
          checkout-ref: ${{ needs.select.outputs.sha }}
