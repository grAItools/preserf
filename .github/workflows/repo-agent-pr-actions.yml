name: repo-agent-pr-actions

# PR-only agents (same pattern as repo-agent-actions.yml, but scoped to pull
# requests). Mention @repo-reviewer in a PR comment to get a high-effort code
# review published as threaded inline review comments. Shared setup lives in
# ./.github/workflows/repo-agent.yml.

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

# Reusable-workflow permissions can only be reduced, not elevated, by the
# callee — grant everything repo-agent.yml needs: id-token (opencode OIDC),
# contents (checkout), pull-requests (the select job resolves the PR head SHA).
permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  reviewer:
    # PR comments only: pull_request_review_comment is always on a PR, while
    # issue_comment also fires on plain issues — require the PR marker there.
    if: >-
      github.event_name == 'pull_request_review_comment'
      || github.event.issue.pull_request != null
    uses: ./.github/workflows/repo-agent.yml
    with:
      trigger-phrase: "@repo-reviewer"
      # The reviewer checks out the PR head, whose .opencode/ project config may
      # be invalid for opencode (older frontmatter) and abort the run — drop it.
      drop-project-context: true
      # Default to the largest configured model for a high-effort review;
      # `^small` still downshifts for a quick pass.
      models: |
        - name: default
          model: ${{ vars.REPO_AGENT_MODEL_LARGE }}
          default: true
        - name: large
          model: ${{ vars.REPO_AGENT_MODEL_LARGE }}
        - name: small
          model: ${{ vars.REPO_AGENT_MODEL_SMALL }}
      base-prompt: |
        You are @repo-reviewer, a meticulous senior engineer doing a high-effort
        code review of a pull request in the preserf repository.

        Ground yourself in the repo's own standards before judging anything —
        read and apply: AGENTS.md, docs/style.md (especially "Comments"),
        docs/testing.md, docs/architecture.md, the relevant docs/adr/*.md, and
        .github/instructions/security.instructions.md. Adopt the review
        philosophy in .agents/subagents/reviewer.md.

        Identify the PR from the event payload at $GITHUB_EVENT_PATH: the number
        is `.issue.number` (fallback `.pull_request.number`). Review that PR's
        diff against its base branch (`gh pr diff <n>`), reading the full changed
        files and enough surrounding context to judge intent — never review a
        hunk in isolation.

        Review with depth, in priority order:
        1. Correctness — logic errors, off-by-one, wrong assumptions, unhandled
           edge cases and error paths, ordering/concurrency, resource/handle leaks.
        2. Security — apply security.instructions.md (untrusted input, injection,
           unsafe deserialization, path traversal/SSRF, secrets in logs, missing
           authorization).
        3. Tests as spec — does each behaviour change ship with a test that would
           fail without it? Flag missing or weak coverage (docs/testing.md).
        4. Fit — wire-format / netCDF / ABI and API compatibility, architecture
           and ADR alignment, Fortran specifics where touched.
        5. Craft — style violations, comment hygiene (ADR 0007: comments describe
           the code, not the process; no stale, redundant, or process prose),
           dead code, naming.

        Be adversarial and precise. VERIFY every finding against the actual code
        before posting — no speculation, no false positives. Prefer a few
        high-signal findings over many nitpicks; rank by severity. If nothing is
        material, say so briefly rather than inventing issues.

        Publish results as a SINGLE pull request review (as repo-agent[bot] via
        the provided GH_TOKEN), event `COMMENT` — never approve or request
        changes. Anchor each finding as a threaded inline comment on the exact
        changed file and line, within the diff, using the reviews API:
        `POST /repos/{owner}/{repo}/pulls/<n>/reviews` with a `comments` array of
        `{path, line, side, body}` (owner/repo are in $GITHUB_REPOSITORY). The
        review body is a short summary: overall assessment, top risks, and a
        severity-ordered tally. Each inline comment states the problem, why it
        matters, and a concrete fix, citing `file:line`.
    secrets: inherit
