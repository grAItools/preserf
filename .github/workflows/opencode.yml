name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # This run inherits secrets and requests id-token: write, so it must not be
    # startable by an arbitrary commenter: gate to trusted author associations.
    # The trigger matches the /oc and /opencode command tokens only when a space
    # follows the token or the token ends the comment, so a word that merely
    # starts with "/oc"/"/opencode" (e.g. /ocaml) does not co-trigger. GitHub
    # Actions expression literals can't hold a newline, so a token immediately
    # followed by a newline is intentionally not matched (write the request on
    # the same line as the command).
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (endsWith(github.event.comment.body, '/oc') ||
       endsWith(github.event.comment.body, '/opencode') ||
       contains(github.event.comment.body, '/oc ') ||
       contains(github.event.comment.body, '/opencode '))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # Custom providers declared in opencode.json read their own key
          # from the environment (e.g. swiss-ai → {env:SWISSAI_API_KEY}).
          CSCS_INFERENCE_API_KEY: ${{ secrets.CSCS_INFERENCE_API_KEY }}
          SWISSAI_API_KEY: ${{ secrets.SWISSAI_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL_DEFAULT || 'cscs-inference/moonshotai/Kimi-K2.7-Code' }}
          # share: true
          # github_token: xxxx
