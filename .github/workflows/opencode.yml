name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
       - name: Checkout repository
         uses: actions/checkout@v6
         with:
           fetch-depth: 1
           persist-credentials: false

       - name: Run OpenCode
         uses: anomalyco/opencode/github@latest
         env:
           # Custom providers declared in opencode.json read their own key
           # from the environment (e.g. swiss-ai → {env:SWISSAI_API_KEY}).
           CSCS_INFERENCE_API_KEY: ${{ secrets.CSCS_INFERENCE_API_KEY }}
           SWISSAI_API_KEY: ${{ secrets.SWISSAI_API_KEY }}
         with:
           model: ${{ variables.OPENCODE_MODEL_DEFAULT}}
           # share: true
           # github_token: xxxx
