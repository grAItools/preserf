name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (linux-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up pixi
        # Keep pixi-version in lockstep with the pin in .devcontainer/Dockerfile
        # so CI and the devcontainer resolve `pixi.lock` with the same pixi.
        # NOTE on tag format: this field is the GitHub release tag and takes a
        # leading `v` (e.g. `v0.70.1`); the OCI image tag in the Dockerfile is
        # the bare version (`0.70.1`). Bump both, but keep the formats distinct.
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.1
          environments: dev examples
          cache: true

      # `test-fortran` chains `build-fortran` via its `depends-on`, so no
      # separate build step is needed.
      - name: Run native Fortran tests (ctest)
        run: pixi run test-fortran

      # PRESERF_REQUIRE_FORTRAN=1 turns the Fortran-binary skip in
      # tests/integration_tests/test_fortran_wire_compat.py into a hard failure, so a broken
      # Fortran build cannot pass CI by silently skipping the wire-compat
      # test. The `verify` pixi task runs fmt-check, lint, typecheck and
      # the full pytest suite.
      - name: Run full verify gate
        env:
          PRESERF_REQUIRE_FORTRAN: "1"
        run: pixi run verify

      # Examples are not part of `pixi run verify`, so CI exercises them
      # as a dedicated step — a broken example breaks the build even
      # though local `pixi run verify` skips this layer.
      - name: Run example end-to-end suite
        run: pixi run test-examples

      # Consumer tests are deselected from `verify` (slow; require a full
      # toolchain build). PRESERF_REQUIRE_FORTRAN=1 turns the Fortran-binary
      # skip into a hard failure, matching the behaviour of `test-py-with-fortran`.
      - name: Run external-consumer / find_package tests
        env:
          PRESERF_REQUIRE_FORTRAN: "1"
        run: pixi run test-consumer
