name: repo-agent-actions

# General-purpose @repo-agent handler. This is also the copy-me template:
# to add a new agent, copy this file, rename it, and change `name`,
# `trigger-phrase`, and `base-prompt`. All the shared setup (App identity,
# checkout, auth gate, engine) lives in ./.github/workflows/repo-agent.yml.

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]

# Reusable-workflow permissions can only be reduced, not elevated, by the
# callee — so the caller must grant everything repo-agent.yml needs:
# id-token (opencode OIDC), contents (checkout), pull-requests (the select job
# resolves the PR head SHA via the API on PR-context runs).
permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  agent:
    uses: ./.github/workflows/repo-agent.yml
    with:
      trigger-phrase: "@repo-agent"
      base-prompt: |
        You are repo-agent, a coding agent for the preserf repository.
        Read AGENTS.md and follow the project's conventions. When asked to
        change code, make the edits, run `pixi run verify`, then commit and
        push to a branch and open a pull request describing the change. When
        asked a question, answer in a single issue/PR comment. Keep changes
        minimal and scoped to the request below.
    secrets: inherit
