name: agent

# Reusable workflow: wraps the @mention plumbing (loop guard, mention parse,
# auth gate) around the agent-runtime composite action. Callers supply only an
# `on:` trigger and a `base-prompt`; everything else is shared infrastructure.
#
# A reusable workflow cannot declare the caller's `on:` triggers, so each
# caller owns its own trigger block and calls this with `uses:`.

on:
  workflow_call:
    inputs:
      base-prompt:
        description: The agent's persona / standing instructions.
        required: true
        type: string
      trigger-phrase:
        description: Mention handle that fires the agent.
        required: false
        type: string
        default: "@preserf-agent"
      model:
        description: opencode model id.
        required: false
        type: string
        default: opencode-go/glm-5.2
      runs-on:
        description: Runner label.
        required: false
        type: string
        default: ubuntu-latest
      allowed-associations:
        description: >-
          Comma-separated author_association values permitted to invoke the
          agent. Gate runs before any PR-head checkout.
        required: false
        type: string
        default: "OWNER,MEMBER,COLLABORATOR"
    secrets:
      OPENCODE_API_KEY:
        required: true
      PRESERF_AGENT_APP_KEY:
        required: true
      SWISSAI_API_KEY:
        required: false

concurrency:
  group: agent-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  run:
    # Coarse pre-filter + loop guard: skip the agent's own comments, and only
    # spin a runner when the trigger phrase appears somewhere in the payload.
    if: >-
      github.event.sender.type != 'Bot' &&
      ( contains(github.event.comment.body, inputs.trigger-phrase)
        || contains(github.event.review.body, inputs.trigger-phrase)
        || contains(github.event.issue.body, inputs.trigger-phrase) )
    runs-on: ${{ inputs.runs-on }}
    environment: opencode
    permissions:
      # Writes ride the App token from agent-runtime, not GITHUB_TOKEN; the
      # opencode engine needs id-token for its own auth (mirrors opencode.yml).
      id-token: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      # A local `uses: ./...` action must exist on disk first; comment/issue
      # events check out nothing by default. agent-runtime re-checks-out as the
      # bot (correct ref + push token) once the gate has passed.
      - name: Checkout action definitions
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Parse mention
        id: ctx
        uses: actions/github-script@v7
        env:
          PHRASE: ${{ inputs.trigger-phrase }}
        with:
          script: |
            const body =
              context.payload.comment?.body ??
              context.payload.review?.body ??
              context.payload.issue?.body ?? '';
            // Word-boundary match so "@preserf-agent-staging" does not trigger.
            const phrase = process.env.PHRASE.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const re = new RegExp(`(^|\\s)${phrase}\\b`);
            const mentioned = re.test(body);
            const command = mentioned ? body.split(new RegExp(`${phrase}\\b`))[1].trim() : '';
            core.setOutput('mentioned', String(mentioned));
            core.setOutput('command', command);

      - name: Authorize caller
        if: steps.ctx.outputs.mentioned == 'true'
        uses: actions/github-script@v7
        env:
          ALLOWED: ${{ inputs.allowed-associations }}
        with:
          script: |
            const assoc =
              context.payload.comment?.author_association ??
              context.payload.review?.author_association ??
              context.payload.issue?.author_association;
            const allowed = process.env.ALLOWED.split(',').map(s => s.trim());
            if (!allowed.includes(assoc))
              core.setFailed(`Not authorized: author_association=${assoc}`);

      - name: Compose prompt
        id: compose
        if: steps.ctx.outputs.mentioned == 'true'
        env:
          BASE: ${{ inputs.base-prompt }}
          COMMAND: ${{ steps.ctx.outputs.command }}
        shell: bash
        run: |
          {
            echo "prompt<<__AGENT_PROMPT_EOF__"
            printf '%s\n\n## Request\n\n%s\n' "$BASE" "$COMMAND"
            echo "__AGENT_PROMPT_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve PR head ref
        id: ref
        if: steps.ctx.outputs.mentioned == 'true'
        uses: actions/github-script@v7
        with:
          # issue_comment payloads omit the PR head SHA, so fetch it; non-PR
          # events fall through to an empty ref (default-branch checkout).
          script: |
            const num = context.payload.issue?.number ?? context.payload.pull_request?.number;
            const isPr = !!(context.payload.issue?.pull_request || context.payload.pull_request);
            if (!isPr || !num) { core.setOutput('sha', ''); return; }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: num,
            });
            core.setOutput('sha', pr.head.sha);

      - name: Run agent
        if: steps.ctx.outputs.mentioned == 'true'
        uses: ./.github/actions/agent-runtime
        with:
          prompt: ${{ steps.compose.outputs.prompt }}
          model: ${{ inputs.model }}
          app-id: ${{ vars.PRESERF_AGENT_APP_ID }}
          private-key: ${{ secrets.PRESERF_AGENT_APP_KEY }}
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
          swissai-api-key: ${{ secrets.SWISSAI_API_KEY }}
          checkout-ref: ${{ steps.ref.outputs.sha }}
