name: agent

# Reusable workflow: wraps the @mention plumbing (loop guard, mention parse,
# auth gate, model selection) around the agent-runtime composite action.
# Callers supply only an `on:` trigger and a `base-prompt`; everything else,
# including the ^model selection table, is shared infrastructure defined here
# once — callers never replicate it.
#
# A reusable workflow cannot declare the caller's `on:` triggers, so each
# caller owns its own trigger block and calls this with `uses:`.

on:
  workflow_call:
    inputs:
      base-prompt:
        description: The agent's persona / standing instructions.
        required: true
        type: string
      trigger-phrase:
        description: Mention handle that fires the agent.
        required: false
        type: string
        default: "@repo-agent"
      models:
        description: >-
          YAML table of selectable models. Each entry: `name` (the ^token a
          user types, e.g. ^glm), `model` (opencode id), and optional
          `default: true`. A mention with one or more ^<name> tokens runs those
          models (one parallel run each); a mention with no token runs the
          default(s). Defined once here — callers only override to change the
          menu. The table should always mark at least one `default: true`.
        required: false
        type: string
        default: |
          - name: default
            model: ${{ vars.REPO_AGENT_MODEL_DEFAULT }}
            default: true
          - name: small
            model: ${{ vars.REPO_AGENT_MODEL_SMALL }}
          - name: large
            model: ${{ vars.REPO_AGENT_MODEL_LARGE }}
          - name: cscs:glm
            model: cscs-inference/zai-org/GLM-5.2
          - name: cscs:kimi
            model: cscs-inference/moonshotai/Kimi-K2.7-Code
          - name: sai:glm4
            model: swiss-ai/zai-org/GLM-4.7-Flash
      runs-on:
        description: Runner label for the agent job.
        required: false
        type: string
        default: ubuntu-latest
      allowed-associations:
        description: >-
          Comma-separated author_association values permitted to invoke the
          agent. Gate runs before any PR-head checkout.
        required: false
        type: string
        default: "OWNER,MEMBER,COLLABORATOR"
    secrets:
      OPENCODE_API_KEY:
        required: true
      REPO_AGENT_APP_KEY:
        required: true
      SWISSAI_API_KEY:
        required: false
      CSCS_INFERENCE_API_KEY:
        required: false

concurrency:
  group: agent-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  select:
    # Coarse pre-filter + loop guard: skip the agent's own comments, and only
    # spin a runner when the trigger phrase appears somewhere in the payload.
    if: >-
      github.event.sender.type != 'Bot' &&
      ( contains(github.event.comment.body || '', inputs.trigger-phrase)
        || contains(github.event.review.body || '', inputs.trigger-phrase)
        || contains(github.event.issue.body || '', inputs.trigger-phrase) )
    runs-on: ubuntu-latest
    outputs:
      mentioned: ${{ steps.ctx.outputs.mentioned }}
      matrix: ${{ steps.pick.outputs.matrix }}
      prompt: ${{ steps.pick.outputs.prompt }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Parse mention
        id: ctx
        uses: actions/github-script@v7
        env:
          PHRASE: ${{ inputs.trigger-phrase }}
        with:
          script: |
            const body =
              context.payload.comment?.body ??
              context.payload.review?.body ??
              context.payload.issue?.body ?? '';
            // Word-boundary match so "@repo-agent-staging" does not trigger.
            const phrase = process.env.PHRASE.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            // Detect and extract with the SAME anchored match: the mention must
            // start the line or follow whitespace, and must not be followed by a
            // word char or hyphen (so "@repo-agent-staging" does not fire). The
            // command is everything after that first valid mention, so an earlier
            // "foo@repo-agent" substring can't hijack the request text.
            const m = body.match(new RegExp(`(?:^|\\s)${phrase}(?![\\w-])`));
            const mentioned = !!m;
            const command = mentioned ? body.slice(m.index + m[0].length).trim() : '';
            core.setOutput('mentioned', String(mentioned));
            core.setOutput('command', command);

      - name: Authorize caller
        if: steps.ctx.outputs.mentioned == 'true'
        uses: actions/github-script@v7
        env:
          ALLOWED: ${{ inputs.allowed-associations }}
        with:
          script: |
            const assoc =
              context.payload.comment?.author_association ??
              context.payload.review?.author_association ??
              context.payload.issue?.author_association;
            const allowed = process.env.ALLOWED.split(',').map(s => s.trim());
            if (!allowed.includes(assoc))
              core.setFailed(`Not authorized: author_association=${assoc}`);

      - name: Select models and compose prompt
        id: pick
        if: steps.ctx.outputs.mentioned == 'true'
        env:
          MODELS: ${{ inputs.models }}
          BASE: ${{ inputs.base-prompt }}
          COMMAND: ${{ steps.ctx.outputs.command }}
        shell: bash
        run: |
          set -euo pipefail
          models_json=$(printf '%s' "$MODELS" | yq -o=json -I=0)

          # Select every table entry whose ^<name> token appears in the command
          # (\b so ^glm does not also match ^glment).
          selected=$(jq -cn --argjson m "$models_json" --arg body "$COMMAND" \
            '[ $m[] | . as $e | select($body | test("\\^" + $e.name + "\\b")) ]')

          # No explicit ^token -> fall back to the table default(s).
          if [ "$selected" = "[]" ]; then
            selected=$(jq -cn --argjson m "$models_json" \
              '[ $m[] | select(.default == true) ]')
          fi

          matrix=$(jq -cn --argjson s "$selected" '{include: [ $s[] | {name, model} ]}')

          # A caller can override `models` with a table that has no default; a
          # tokenless mention then selects nothing. Fail loudly rather than
          # dispatch an empty/invalid matrix.
          if [ "$(jq -r '.include | length' <<<"$matrix")" -eq 0 ]; then
            echo "::error::no models selected: the ^token(s) matched no table entry and the models table has no 'default: true'." >&2
            exit 1
          fi

          # An entry can carry an empty model id if its backing repo variable
          # (e.g. REPO_AGENT_MODEL_DEFAULT) is unset — catch it here rather than
          # dispatch opencode with an empty model.
          empty=$(jq -r '.include[] | select((.model // "") == "") | .name' <<<"$matrix")
          if [ -n "$empty" ]; then
            echo "::error::model id is empty for: ${empty//$'\n'/, } — set the backing REPO_AGENT_MODEL_* repository variable(s)." >&2
            exit 1
          fi

          names=$(printf '%s' "$models_json" | jq -r '[ .[].name ] | join("|")')

          # Strip the ^<name> selection tokens from the prompt the agent sees.
          cleaned=$(printf '%s' "$COMMAND" \
            | sed -E "s/[[:space:]]*\^(${names})\b//g" \
            | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "prompt<<__AGENT_PROMPT_EOF__"
            printf '%s\n\n## Request\n\n%s\n' "$BASE" "$cleaned"
            echo "__AGENT_PROMPT_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve PR head ref
        id: ref
        if: steps.ctx.outputs.mentioned == 'true'
        uses: actions/github-script@v7
        with:
          # issue_comment payloads omit the PR head SHA, so fetch it; non-PR
          # events fall through to an empty ref (default-branch checkout).
          script: |
            const num = context.payload.issue?.number ?? context.payload.pull_request?.number;
            const isPr = !!(context.payload.issue?.pull_request || context.payload.pull_request);
            if (!isPr || !num) { core.setOutput('sha', ''); return; }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: num,
            });
            core.setOutput('sha', pr.head.sha);

  agent:
    needs: select
    if: needs.select.outputs.mentioned == 'true'
    runs-on: ${{ inputs.runs-on }}
    name: agent (${{ matrix.name }})
    environment: opencode
    permissions:
      # Writes ride the App token from agent-runtime, not GITHUB_TOKEN; the
      # opencode engine needs id-token for its own auth (mirrors opencode.yml).
      id-token: write
      contents: read
      issues: read
      pull-requests: read
    strategy:
      # One ^model must not cancel the others; each reports independently.
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      # A local `uses: ./...` action must exist on disk first; comment/issue
      # events check out nothing by default. agent-runtime re-checks-out as the
      # bot (correct ref + push token) once the gate has passed.
      - name: Checkout action definitions
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Run agent
        uses: ./.github/actions/agent-runtime
        with:
          prompt: ${{ needs.select.outputs.prompt }}
          model: ${{ matrix.model }}
          app-id: ${{ vars.REPO_AGENT_APP_ID }}
          private-key: ${{ secrets.REPO_AGENT_APP_KEY }}
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
          swissai-api-key: ${{ secrets.SWISSAI_API_KEY }}
          cscs-inference-api-key: ${{ secrets.CSCS_INFERENCE_API_KEY }}
          checkout-ref: ${{ needs.select.outputs.sha }}
