name: cmd-review

# Example custom slash command. This file is the entire per-command surface
# area: to add a command, copy this file and change the command word in the two
# places marked below (the `if:` prefilter and `with.command`) and the prompt.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    # Cheap prefilter so a runner is not spun up for every comment (loose
    # contains() on purpose; the strict word-boundary match is in the parser),
    # restricted to PR context: /review is PR-scoped, so ignore it on plain
    # issues. pull_request_review_comment is always on a PR; issue_comment also
    # fires on non-PR issues, so require the PR marker there. The
    # author-association gate is centralized in the engine
    # (opencode-cmd-engine.yml), so callers don't repeat it here.
    if: >-
      contains(github.event.comment.body, '/agent') &&
      (github.event_name == 'pull_request_review_comment'
       || github.event.issue.pull_request != null)
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/opencode-cmd-engine.yml
    secrets: inherit
    with:
      command: agent
      prompt: |
        {{request}}
