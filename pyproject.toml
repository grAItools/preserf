[project]
name = "preserf"
dynamic = ["version"]
description = "A preprocessor for Fortran data serialization directives"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Enrique González Paredes", email = "enriqueg@cscs.ch" },
  { name = "Hannes Vogt", email = "hannes@havogt.de" },
]
maintainers = [
  { name = "Enrique González Paredes", email = "enriqueg@cscs.ch" },
  { name = "Hannes Vogt", email = "hannes@havogt.de" },
]
keywords = [
  "fortran",
  "serialization",
  "preprocessor",
  "serialbox",
  "netcdf",
  "hpc",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Fortran",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Pre-processors",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/grAItools/preserf"
Repository = "https://github.com/grAItools/preserf"
Changelog = "https://github.com/grAItools/preserf/blob/main/CHANGELOG.md"
Issues = "https://github.com/grAItools/preserf/issues"

[project.scripts]
preserf = "preserf.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: hatch reads `__version__` from
# `src/preserf/__init__.py`, the wheel metadata derives from it, and
# `importlib.metadata.version("preserf")` reflects it after install.
# Bumping the release means editing that one literal.
[tool.hatch.version]
path = "src/preserf/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/preserf"]

[tool.ruff]
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "UP", # pyupgrade
  "B", # flake8-bugbear
  "SIM", # flake8-simplify
  "TC", # flake8-type-checking
  "RUF", # ruff-specific rules
  "ERA", # eradicate — no commented-out code
  "FIX", # flake8-fixme — no leftover TODO/FIXME/XXX/HACK markers
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The external-consumer test compiles and runs a real project against the
# bundled runtime — too slow for the fast `verify` gate. Deselect it by
# default; `pixi run test-consumer` (part of `test-all`) re-selects it with
# `-m consumer`, which overrides this default expression.
addopts = "-m 'not consumer'"
markers = [
  "consumer: end-to-end build of an external project against the bundled runtime (slow)",
]
