[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
fortran-compiler = "*"
netcdf-fortran = ">=4.6.0"
pkg-config = ">=0.29.2,<0.30"
python = ">=3.12"

[pypi-dependencies]
preserf = { path = ".", editable = true }

[feature.dev.dependencies]
cmake = ">=3.20"
c-compiler = "*"
cxx-compiler = "*"
dprint = ">=0.47"
netcdf4 = ">=1.7.4"
numpy = ">=1.26"

[feature.dev.pypi-dependencies]
build = ">=1.2"
fprettify = ">=0.3"
hatchling = ">=1.25"
mypy = ">=1.0"
pytest = ">=8.0"
ruff = ">=0.8"
# Upstream Serialbox Python distribution, used test-only to differentially
# validate preserf's `!$SER` expansion against the reference `pp_ser`
# preprocessor it ports. See docs/adr/0006-ppser-differential-dependency.md.
serialbox4py = ">=2.6.3"

# Standalone examples under examples/, exercised by `pixi run test-examples`
# (which is part of `pixi run test-all` but deliberately NOT part of
# `pixi run verify` — verify covers the strict Python+Fortran suite,
# not the slower end-to-end example builds). Adds the plotting/reading
# deps and cmake on top of the default Fortran toolchain and the
# editable `preserf` CLI.
[feature.examples.dependencies]
cmake = ">=3.20"
netcdf4 = ">=1.7.4"
numpy = ">=1.26"
matplotlib = ">=3.8"

[environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
examples = { features = ["examples"], solve-group = "default" }

[tasks]
build-fortran = { cmd = ["sh", "-c", "cmake -S tests-fortran -B build/preserf-fortran && cmake --build build/preserf-fortran"], default-environment = "dev" }
clean-fortran = { cmd = ["rm", "-rf", "build/preserf-fortran"], default-environment = "dev" }
fmt-d = { cmd = ["dprint", "fmt"], default-environment = "dev" }
fmt-d-check = { cmd = ["dprint", "check"], default-environment = "dev" }
fmt-f = { cmd = ["fprettify", "--recursive", "src/preserf/fortran"], default-environment = "dev" }
fmt-f-src = { cmd = ["fprettify"], default-environment = "dev" }
fmt-py = { cmd = ["ruff", "format", "src", "tests"], default-environment = "dev" }
fmt-py-src = { cmd = ["ruff", "format"], default-environment = "dev" }
fmt = { depends-on = ["fmt-py", "fmt-f", "fmt-d"] }
fmt-f-check = { cmd = ["python", "-c", "import subprocess,sys;r=subprocess.run(['fprettify','--diff','--recursive','src/preserf/fortran'],capture_output=True,text=True);sys.stdout.write(r.stdout);r.returncode and sys.stderr.write(r.stderr);sys.exit(1 if r.stdout.strip() or r.returncode else 0)"], default-environment = "dev" }
fmt-py-check = { cmd = ["ruff", "format", "--check", "src", "tests"], default-environment = "dev" }
fmt-check = { depends-on = ["fmt-py-check", "fmt-f-check", "fmt-d-check"] }
lint = { cmd = ["ruff", "check", "src", "tests"], default-environment = "dev" }
test-fortran = { cmd = ["ctest", "--test-dir", "build/preserf-fortran", "--output-on-failure"], default-environment = "dev", depends-on = ["build-fortran"] }
test-py-unit = { cmd = ["pytest", "tests/unit_tests"], default-environment = "dev" }
test-py-integration = { cmd = ["pytest", "tests/integration_tests"], default-environment = "dev" }
test-py = { cmd = ["pytest"], default-environment = "dev" }
# Strict pytest run for the cross-language gate: serializes after
# `test-fortran` (which itself depends on `build-fortran`), and sets
# PRESERF_REQUIRE_FORTRAN=1 so the wire-compat integration test fails
# instead of skipping when the Fortran binary is missing. Pixi's
# `depends-on` only orders a task's own deps before its `cmd`; siblings
# under a single `depends-on` list may run in parallel, so we need this
# extra serialization to guarantee `pytest` doesn't start before the
# Fortran binary exists.
test-py-with-fortran = { cmd = ["pytest"], default-environment = "dev", env = { PRESERF_REQUIRE_FORTRAN = "1" }, depends-on = ["test-fortran"] }
test-examples = { cmd = ["bash", "examples/run-all.sh"], default-environment = "examples" }
# External-consumer end-to-end build (deselected from `verify` by the
# `-m 'not consumer'` default in pyproject; `-m consumer` here overrides it).
test-consumer = { cmd = ["pytest", "-m", "consumer"], default-environment = "dev", env = { PRESERF_REQUIRE_FORTRAN = "1" } }
test-all = { depends-on = ["test-py-with-fortran", "test-examples", "test-consumer"] }
typecheck = { cmd = ["mypy", "src"], default-environment = "dev" }
verify = { depends-on = ["fmt-check", "lint", "typecheck", "test-py-with-fortran"] }
# clean = { cmd = ["rm", "-rf", "build", "dist", "preserf.egg-info"] }
