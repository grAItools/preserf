schema: spec-driven

context: |
  preserf is a preprocessor for Fortran data serialization directives:
  a Python package that expands !$SER directives in Fortran source into
  explicit serialization calls, plus the Fortran runtime those calls
  target (shipped as source inside the wheel). The runtime writes to
  NetCDF4 stores (default) or NCZarr V2 stores, both via the same
  nf90_* code path; the layout/dtype mapping is in
  dev/references/storage_mapping.md, the directive grammar in
  dev/references/directives_specification.md.

  Layout: src/preserf/ holds the preprocessor (preprocessor.py is a
  typed port of Serialbox's pp_ser.py; cli.py is a Typer CLI) and
  src/preserf/fortran/ holds the runtime (m_preserf.F90 canonical
  fs_* API, utils_preserf.f90 ppser_* lifecycle, m_serialize.f90 /
  utils_ppser.f90 alias modules so legacy pp_ser output compiles
  unchanged).

  Tooling: pixi (conda-forge) is the single entry point; do not
  install Python/Fortran tools by hand. The verification gate is
  `pixi run verify` (fmt-check + lint + typecheck + Fortran
  build/ctest + strict pytest). Run it before claiming any task done.

  Conventions: tests are the spec (change a test first when behaviour
  changes). Errors carry file/line context via DirectiveError.
  Documentation is split by audience: docs/ holds user documentation,
  dev/ holds development docs (style.md, testing.md, adr/,
  references/); ADRs are append-only, supersede with a new file. No
  new runtime dependency without an ADR.

rules:
  proposal:
    - Keep proposals under 200 words and always state what is out of scope
    - Net-new features and architectural choices (dependency, framework,
      persistence, auth) require an ADR in dev/adr/ as part of the change
    - User-facing changes must log one concise bullet under [Unreleased]
      in CHANGELOG.md, leading with the file/behaviour
  specs:
    - Requirements describe externally observable behaviour with
      concrete WHEN/THEN scenarios; keep implementation detail out
    - Cross-check behaviour claims against dev/references/
      (directive grammar, storage mapping) and the actual source
  tasks:
    - Break tasks into phases of at most a few hours, each phase
      landing with its tests
    - When behaviour changes, the task list must include the test
      change (tests are the spec)
    - Finish each task by running `pixi run verify`

operations:
  apply:
    guidance:
      - Run `pixi run verify` before marking any task complete; CI is
        the only hard gate, so do not claim done on a red tree
      - Commit with Conventional Commits; the PR title (squash-merge)
        carries the conventional type
  archive:
    guidance:
      - Merge the change's delta specs into openspec/specs/ only after
        every tasks.md box is checked and `pixi run verify` passes
      - Summarize what was added/modified in each capability spec, and
        confirm CHANGELOG.md and any ADRs are already updated
